<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>beatscope</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --fg: #f2f2f2;
    --dim: rgba(242, 242, 242, 0.5);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--fg); overflow: hidden; }
  body { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; -webkit-font-smoothing: antialiased; }
  canvas#gl { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }

  #empty {
    position: fixed; inset: 0; display: grid; place-content: center; justify-items: center;
    gap: 14px; text-align: center; pointer-events: none;
    background: radial-gradient(ellipse 38% 30% at 50% 50%, rgba(0,0,0,0.92), rgba(0,0,0,0.6) 70%, rgba(0,0,0,0.35));
    transition: opacity 200ms var(--ease-out), transform 200ms var(--ease-out);
  }
  body.loaded #empty { opacity: 0; transform: scale(0.98); }
  body.loaded #empty * { pointer-events: none !important; }
  #empty h1 { margin: 0; font-weight: 500; font-size: 15px; letter-spacing: 0.08em; }
  #empty p { margin: 0; font-size: 13px; color: rgba(242, 242, 242, 0.7); }
  #empty .tag { font-family: VT323, monospace; font-size: 40px; line-height: 1; color: #fff; margin-bottom: 10px; }
  button {
    pointer-events: auto; font: inherit; font-size: 13px; color: #000; background: var(--fg);
    border: 0; border-radius: 999px; padding: 10px 20px; cursor: pointer;
    transition: transform 160ms var(--ease-out);
  }
  button:active { transform: scale(0.97); }

  #drop {
    position: fixed; inset: 12px; border: 1px dashed var(--dim); border-radius: 14px;
    opacity: 0; pointer-events: none; transition: opacity 150ms var(--ease-out);
  }
  body.drag #drop { opacity: 1; }

  #status {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    font-family: VT323, monospace; font-size: 28px; color: #fff;
    background: rgba(0, 0, 0, 0.8); padding: 8px 18px; border-radius: 10px;
    opacity: 0; pointer-events: none; transition: opacity 150ms var(--ease-out);
  }
  #status.on { opacity: 1; }
  #hud {
    position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
    font-size: 11px; color: var(--dim); white-space: nowrap; letter-spacing: 0.02em;
    transition: opacity 200ms var(--ease-out);
  }
  #hud b { color: var(--fg); font-weight: 500; }
  body.idle #hud, body:not(.loaded) #hud { opacity: 0; }
  body.idle { cursor: none; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="empty">
  <h1>BEATSCOPE</h1>
  <div class="tag">Every hit. On the line.</div>
  <button id="pick">choose audio</button>
  <p>or drop a file anywhere</p>
</div>
<div id="drop"></div>
<div id="status"></div>
<div id="hud"><b>space</b> play &nbsp;·&nbsp; <b>← →</b> seek &nbsp;·&nbsp; <b>click bar</b> scrub &nbsp;·&nbsp; <b>I</b> inverts <span id="invState">on</span> &nbsp;·&nbsp; <b>G</b> glow &nbsp;·&nbsp; <b>F</b> fullscreen &nbsp;·&nbsp; <b>O</b> open</div>
<input type="file" id="file" accept="audio/*,video/*" hidden>
<audio id="audio" preload="auto"></audio>

<script>
const $ = s => document.querySelector(s);
const glc = $('#gl'), audio = $('#audio');
const cv = document.createElement('canvas');
const ctx = cv.getContext('2d', { alpha: false });
const FONT = '"IBM Plex Mono", ui-monospace, Menlo, monospace';
const PIXEL = 'VT323, "IBM Plex Mono", monospace';
const clamp = (v, a = -1, b = 1) => v < a ? a : v > b ? b : v;
const ease = (dt, tau) => 1 - Math.exp(-dt / tau);

// ---------- audio ----------
const FFT = 8192, SCOPE_N = 4096;
const td = new Float32Array(FFT), fd = new Float32Array(FFT / 2).fill(-140), lp = new Float32Array(FFT);
let ac = null, an = null, anBass = null, anL = null, anR = null;
const GONIO_N = 1024, tdL = new Float32Array(GONIO_N), tdR = new Float32Array(GONIO_N);
const BASS_N = 4096, tdBass = new Float32Array(BASS_N), RING_M = 360, ringR = new Float32Array(RING_M).fill(1);

function ensureAudio() {
  if (ac) return;
  ac = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
  an = ac.createAnalyser();
  an.fftSize = FFT;
  an.smoothingTimeConstant = 0;
  const src = ac.createMediaElementSource(audio);
  src.connect(an);
  an.connect(ac.destination);
  // bass-only tap for the circle scope: three cascaded lowpasses, analyser kept alive via a muted gain
  let node = src;
  for (let i = 0; i < 3; i++) { const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 110; f.Q.value = 0.6; node.connect(f); node = f; }
  anBass = ac.createAnalyser(); anBass.fftSize = BASS_N; anBass.smoothingTimeConstant = 0;
  node.connect(anBass);
  const mute = ac.createGain(); mute.gain.value = 0;
  anBass.connect(mute); mute.connect(ac.destination);
  // stereo taps for the phase scope
  const split = ac.createChannelSplitter(2);
  src.connect(split);
  anL = ac.createAnalyser(); anR = ac.createAnalyser();
  for (const [a, ch] of [[anL, 0], [anR, 1]]) { a.fftSize = GONIO_N; a.smoothingTimeConstant = 0; split.connect(a, ch); a.connect(mute); }
}

let peaks = null, trackName = '', objURL = null, loadToken = 0;
async function load(file) {
  if (!file) return;
  ensureAudio();
  ac.resume();
  const token = ++loadToken;
  trackName = file.name.replace(/\.[^.]+$/, '');
  peaks = null; beats = null; st.bassRef = 0;
  document.body.classList.add('loaded');
  // formats the browser can't play (ALAC m4a in Chrome, aiff, wma…) get transcoded to wav in-page
  let blob = file;
  if (!(await playable(file))) {
    if (token !== loadToken) return;
    setStatus(`converting ${(file.name.match(/\.([^.]+)$/) || [, 'file'])[1]}…`);
    try { blob = await transcode(file); }
    catch (e) { if (token === loadToken) setStatus("couldn't read that file"); return; }
    if (token !== loadToken) return;
    setStatus('');
  }
  if (objURL) URL.revokeObjectURL(objURL);
  objURL = URL.createObjectURL(blob);
  audio.src = objURL;
  audio.play().catch(() => {});
  try {
    const ab = await ac.decodeAudioData(await blob.arrayBuffer());
    if (token !== loadToken) return;
    peaks = computePeaks(ab, 240);
    beats = detectBeats(ab);
    beatIdx = 0;
    const ref = await bassReference(ab);
    if (token === loadToken) st.bassRef = ref;
  } catch (e) { /* timeline stays flat, live detector takes over; playback still works */ }
}

// Song-wide bass level for the sub cone: the whole track through the same three lowpasses the live tap uses
// (offline, mono-summed like the analyser), then the 99th-percentile block peak so one freak transient can't set the scale.
async function bassReference(ab) {
  const oc = new OfflineAudioContext(1, ab.length, ab.sampleRate), s = oc.createBufferSource();
  s.buffer = ab;
  let node = s;
  for (let i = 0; i < 3; i++) { const f = oc.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 110; f.Q.value = 0.6; node.connect(f); node = f; }
  node.connect(oc.destination);
  s.start();
  const d = (await oc.startRendering()).getChannelData(0), B = 1024, pk = [];
  for (let i = 0; i + B <= d.length; i += B) { let m = 0; for (let j = i; j < i + B; j++) { const v = Math.abs(d[j]); if (v > m) m = v; } pk.push(m); }
  pk.sort((a, b) => a - b);
  return pk[Math.floor(pk.length * 0.99)] || 0;
}

// Offline kick detection: low band envelope -> log-energy flux -> adaptive threshold -> peak pick.
// Knowing every onset up front means triggers land exactly on the hit instead of a frame or two late.
let beats = null, beatIdx = 0;
function detectBeats(ab) {
  const sr = ab.sampleRate, hop = Math.round(sr * 0.005), len = ab.length;
  const chans = [];
  for (let c = 0; c < ab.numberOfChannels; c++) chans.push(ab.getChannelData(c));
  const a = 1 - Math.exp(-2 * Math.PI * 130 / sr); // two cascaded one-poles ≈ 130 Hz lowpass
  const n = Math.floor(len / hop), env = new Float32Array(n), sq = new Float32Array(n);
  let y1 = 0, y2 = 0;
  for (let f = 0; f < n; f++) {
    let s = 0;
    for (let j = f * hop, e = j + hop; j < e; j++) {
      let v = 0;
      for (const d of chans) v += d[j];
      y1 += (v - y1) * a; y2 += (y1 - y2) * a;
      s += y2 * y2;
    }
    sq[f] = s / hop;
  }
  // energy over a trailing 30 ms window: longer than one cycle of a 35 Hz 808, so its tail reads as a smooth
  // decay instead of rippling (5 ms slices of a slow sine look like a string of fresh attacks)
  const WIN = 6;
  for (let f = 0, acc = 0; f < n; f++) {
    acc += sq[f]; if (f >= WIN) acc -= sq[f - WIN];
    env[f] = 10 * Math.log10(Math.max(acc, 0) / Math.min(f + 1, WIN) + 1e-10);
  }
  // flux over a 20 ms lag so slow swells don't count, only attacks
  const lag = 4, flux = new Float32Array(n);
  for (let f = lag; f < n; f++) flux[f] = Math.max(0, env[f] - env[f - lag]);
  // adaptive threshold: local mean + 1.4 sd over ±0.6 s
  const W2 = Math.round(0.6 / 0.005), pre = new Float64Array(n + 1), pre2 = new Float64Array(n + 1);
  for (let f = 0; f < n; f++) { pre[f + 1] = pre[f] + flux[f]; pre2[f + 1] = pre2[f] + flux[f] * flux[f]; }
  const cand = [];
  for (let f = 1; f < n - 1; f++) {
    const lo = Math.max(0, f - W2), hi = Math.min(n, f + W2), k = hi - lo;
    const mean = (pre[hi] - pre[lo]) / k, sd = Math.sqrt(Math.max(0, (pre2[hi] - pre2[lo]) / k - mean * mean));
    const v = flux[f];
    if (v < 2.5 || v < mean + 1.4 * sd || env[f] < -55) continue;
    let isMax = true;
    for (let g = Math.max(0, f - 8); g <= Math.min(n - 1, f + 8); g++) if (flux[g] > v) { isMax = false; break; }
    if (isMax) cand.push({ t: (f - lag + 1) * 0.005, s: v, f });
  }
  // Score every hit against the whole song: how loud the low end lands (level) + how sharp the attack is (flux).
  // The big ones invert; everything gets warp/punch scaled by score.
  const pct = (arr, p) => { const s = [...arr].sort((x, y) => x - y); return s[Math.min(s.length - 1, Math.floor(s.length * p))] ?? 0; };
  for (const c of cand) { let m = -200; for (let g = c.f; g < Math.min(n, c.f + 10); g++) m = Math.max(m, env[g]); c.lvl = m; }
  // gate against the song's loud low end: wobbles at the end of an 808 tail sit 30+ dB under the real hits
  const step = Math.max(1, Math.floor(n / 20000)), sample = [];
  for (let f = 0; f < n; f += step) sample.push(env[f]);
  const loud = pct(sample, 0.97);
  const out = [];
  for (const c of cand) {
    if (c.lvl < loud - 24) continue;
    const prev = out[out.length - 1];
    if (prev && c.t - prev.t < 0.12) { if (c.s > prev.s) out[out.length - 1] = c; continue; }
    // masking: an 808 notches and re-swells ~150 ms after the hit; inside 250 ms only a clearly bigger hit counts
    if (prev && c.t - prev.t < 0.25) {
      let since = prev.lvl;
      for (let g = prev.f; g < c.f; g++) since = Math.max(since, env[g]);
      if (c.lvl < since + 3) continue;
    }
    out.push(c);
  }
  const lv = out.map(b => b.lvl), fl = out.map(b => b.s);
  const l10 = pct(lv, 0.1), l98 = pct(lv, 0.98), f90 = pct(fl, 0.9) || 1;
  // weighted toward level: a kick out of silence has a huge attack but isn't "bigger" than one riding a bassline
  for (const b of out) b.score = clamp(0.75 * clamp((b.lvl - l10) / Math.max(1, l98 - l10), 0, 1) + 0.25 * clamp(b.s / f90, 0, 1), 0, 1);
  const order = [...out].sort((x, y) => x.score - y.score);
  order.forEach((b, i) => { b.rank = order.length > 1 ? i / (order.length - 1) : 1; });
  // invert = every hit that lands within 10 dB of the song's loudest kicks (absolute, not a rank cutoff, which skipped
  // equally strong kicks whenever most of a song's kicks are strong; no attack gate, kicks over a held 808 have little)
  for (const b of out) { b.inv = b.lvl >= l98 - 10; b.s = b.score; }
  // tempo from inter-onset intervals, folded into 70–180
  const iv = [];
  for (let i = 1; i < out.length; i++) { let d = out[i].t - out[i - 1].t; if (d < 0.2 || d > 2) continue; let bpm = 60 / d; while (bpm < 70) bpm *= 2; while (bpm > 180) bpm /= 2; iv.push(bpm); }
  iv.sort((x, y) => x - y);
  st.bpm = iv.length > 3 ? iv[Math.floor(iv.length / 2)] : 0;
  return out;
}

// s: 0..1 song-relative strength -> warp/punch amount; inv: this hit is one of the song's big ones
// Sub driver: excursion is the bass-only signal itself (lowpassed < ~110 Hz), scaled linearly against the whole
// song's loudest bass (no AGC), so quiet sub barely moves and only the big hits use the full stroke.
// A 35 Hz cone travels several times per frame, so it's drawn as real motion blur: the line at many points along
// its actual path since the last frame, each faint, like a long exposure.
const CONE_TAPS = 48;
const cone = { pos: new Float32Array(CONE_TAPS), ref: 0.05, live: 0.02, peak: 0 };
const XMAX = 20; // mm, full rail
// trails hold a fixed span of time, not a fixed frame count, so they look the same at 60 and 144 Hz
const trailLen = (dt, secs) => clamp(Math.round(secs / Math.max(dt, 1 / 360)), 2, 16);
function updateCone(dt) {
  const sr = ac ? ac.sampleRate : 48000, n = clamp(Math.round(sr * dt), CONE_TAPS, BASS_N);
  let pk = 0;
  for (let i = BASS_N - n; i < BASS_N; i++) pk = Math.max(pk, Math.abs(tdBass[i]));
  // reference: the song-wide bass peak from the offline pass; until that exists, a peak that only creeps down over ~20 s
  cone.live = pk > cone.live ? pk : cone.live + (pk - cone.live) * ease(dt, 20);
  const ref = Math.max(st.bassRef || cone.live, 0.01);
  const g = audio.paused ? 0 : 0.92 / ref;
  for (let k = 0; k < CONE_TAPS; k++) cone.pos[k] = clamp(tdBass[BASS_N - n + Math.round(k / (CONE_TAPS - 1) * (n - 1))] * g);
  // readable peak excursion: holds briefly, then falls ~25 mm/s
  const ex = clamp(pk * g, 0, 1);
  cone.peak = ex > cone.peak ? ex : Math.max(ex, cone.peak - dt * 1.25);
}

function fireBeat(t, s, inv) {
  st.lastBeat = t;
  st.pulse = Math.max(st.pulse, 0.12 + 0.88 * Math.pow(s, 1.6));
  if (st.flashes && inv) st.invUntil = t + 0.07;
}

function setStatus(s) { const el = $('#status'); el.textContent = s; el.classList.toggle('on', !!s); }

function playable(blob) {
  return new Promise(res => {
    const a = new Audio(), u = URL.createObjectURL(blob);
    let settled = false;
    const done = v => { if (settled) return; settled = true; URL.revokeObjectURL(u); a.removeAttribute('src'); res(v); };
    a.oncanplay = () => done(true);
    a.onerror = () => done(false);
    a.preload = 'auto'; a.src = u;
    setTimeout(() => done(true), 4000);
  });
}

// ffmpeg.wasm (vendored, ~31MB) only loads the first time a file needs converting
let ffmpegP = null;
function loadScript(src) {
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
}
function getFFmpeg() {
  ffmpegP ??= (async () => {
    await loadScript('vendor/ffmpeg/ffmpeg.js');
    const ff = new FFmpegWASM.FFmpeg(), base = new URL('vendor/ffmpeg/', location.href).href;
    await ff.load({ coreURL: base + 'ffmpeg-core.js', wasmURL: base + 'ffmpeg-core.wasm' });
    return ff;
  })().catch(e => { ffmpegP = null; throw e; });
  return ffmpegP;
}
async function transcode(file) {
  const ff = await getFFmpeg();
  const inName = 'in' + ((file.name.match(/\.[^.]+$/) || ['.bin'])[0]);
  await ff.writeFile(inName, new Uint8Array(await file.arrayBuffer()));
  const code = await ff.exec(['-i', inName, '-vn', '-ac', '2', '-c:a', 'pcm_s16le', 'out.wav']);
  if (code !== 0) throw new Error('ffmpeg exit ' + code);
  const data = await ff.readFile('out.wav');
  await ff.deleteFile(inName); await ff.deleteFile('out.wav');
  return new Blob([data], { type: 'audio/wav' });
}

// signed min/max of the mono mix at `rate` buckets per second, for the scrolling arrangement strip
function computePeaks(ab, rate) {
  const len = ab.length, chans = [];
  for (let c = 0; c < ab.numberOfChannels; c++) chans.push(ab.getChannelData(c));
  const step = ab.sampleRate / rate, n = Math.ceil(len / step);
  const mn = new Float32Array(n), mx = new Float32Array(n), k = 1 / chans.length;
  let top = 0;
  for (let i = 0; i < n; i++) {
    const s = Math.floor(i * step), e = Math.min(len, Math.floor((i + 1) * step));
    let lo = 0, hi = 0;
    for (let j = s; j < e; j++) {
      let v = 0;
      for (const d of chans) v += d[j];
      v *= k;
      if (v < lo) lo = v; if (v > hi) hi = v;
    }
    mn[i] = lo; mx[i] = hi;
    top = Math.max(top, hi, -lo);
  }
  if (top > 0) for (let i = 0; i < n; i++) { mn[i] /= top; mx[i] /= top; }
  return { mn, mx, rate, n };
}

// audio.currentTime ticks coarsely in some browsers; extrapolate between ticks so the playhead glides
const clk = { ct: 0, t: 0 };
function playTime() {
  const now = performance.now() / 1000, ct = audio.currentTime;
  if (ct !== clk.ct || audio.paused) { clk.ct = ct; clk.t = now; return ct; }
  return Math.min(ct + (now - clk.t) * audio.playbackRate, audio.duration || ct);
}

// ---------- analysis state ----------
const st = {
  gain: 2, peak: 0.3,
  lowAvg: -40, lowPrev: -40, lastBeat: -1,
  pulse: 0, invUntil: 0, flashes: true, glow: true,
  bpm: 0, rms: 0, pk: 0, hist: new Float32Array(90), histAcc: 0,
  split: [0.22, 0.65], // pane dividers as fractions of width
};
try { const s = JSON.parse(localStorage.getItem('beatscope.split')); if (s && s.length === 2) st.split = s; } catch (e) {}
let specS = null, specP = null, specCols = 0;

function analyse(t, dt) {
  if (an) { an.getFloatTimeDomainData(td); an.getFloatFrequencyData(fd); }
  else for (let i = 0; i < FFT; i++) td[i] = Math.sin(i * 0.004 + t * 1.3) * 0.02 + (Math.random() - 0.5) * 0.004;

  // AGC: fast attack, slow release so quiet tracks still fill the panes
  let pk = 0;
  for (let i = FFT - 4096; i < FFT; i++) { const v = Math.abs(td[i]); if (v > pk) pk = v; }
  st.peak = pk > st.peak ? st.peak + (pk - st.peak) * ease(dt, 0.02) : st.peak + (pk - st.peak) * ease(dt, 2.5);
  const target = clamp(0.92 / Math.max(st.peak, 0.02), 1, 8);
  st.gain += (target - st.gain) * ease(dt, 0.25);

  // kick detector on the 35–140 Hz band
  const sr = ac ? ac.sampleRate : 48000, hz = sr / FFT;
  let e = 0;
  for (let b = Math.floor(35 / hz); b <= Math.ceil(140 / hz); b++) e += Math.pow(10, fd[b] / 10);
  const le = 10 * Math.log10(e + 1e-14);
  const rise = le - st.lowAvg;
  if (beats) {
    // precomputed onsets: fire every beat the playhead just crossed (seeks re-sync the cursor)
    const pt = playTime();
    if (beatIdx > 0 && beats[beatIdx - 1].t > pt + 0.05) beatIdx = 0;
    if (beatIdx < beats.length && pt - beats[beatIdx].t > 0.25) while (beatIdx < beats.length && beats[beatIdx].t < pt - 0.02) beatIdx++;
    while (beatIdx < beats.length && beats[beatIdx].t <= pt) { if (!audio.paused) fireBeat(t, beats[beatIdx].s, beats[beatIdx].inv); beatIdx++; }
  } else if (!audio.paused && le > -70 && rise > 4.5 && le >= st.lowPrev && t - st.lastBeat > 0.17) {
    const s = clamp((rise - 3) / 8, 0, 1);
    fireBeat(t, s, s > 0.7);
  }
  st.lowPrev = le;

  if (anBass) anBass.getFloatTimeDomainData(tdBass);
  updateCone(dt);

  // meters + scrolling peak history for the header
  let sq = 0; for (let i = FFT - 2048; i < FFT; i++) sq += td[i] * td[i];
  const rms = Math.sqrt(sq / 2048);
  st.rms += (rms - st.rms) * ease(dt, rms > st.rms ? 0.01 : 0.15);
  st.pk = Math.max(pk, st.pk * Math.exp(-dt * 3));
  st.histAcc += dt;
  if (st.histAcc > 1 / 40) { st.histAcc = Math.min(st.histAcc - 1 / 40, 1 / 40); st.hist.copyWithin(0, 1); st.hist[st.hist.length - 1] = pk; }
  st.lowAvg += (le - st.lowAvg) * ease(dt, 0.45);
  st.pulse *= Math.exp(-dt * 9);
}

// ---------- drawing ----------
let W = 0, H = 0, DPR = 1;
const L = {}; // layout in device pixels

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.floor(innerWidth * DPR); H = Math.floor(innerHeight * DPR);
  cv.width = glc.width = W; cv.height = glc.height = H;
  const gap = Math.round(W * 0.006);
  // proportions lifted from the reference frame (768x576 phone shot of FL Studio)
  L.ov = { x: 0, y: Math.round(H * 0.25), w: W, h: Math.round(H * 0.14) };
  L.title = H * 0.47;
  L.gap = gap;
  const asp = W / H;
  lens.zoom = 1 / (1 - lens.warp * Math.max(asp * asp / 4, 0.25));
  layoutPanes();
  resizeGL();
}

function layoutPanes() {
  const py = Math.round(H * 0.67), ph = Math.round(H * 0.36), gap = L.gap;
  const xa = Math.round(W * st.split[0]), xb = Math.round(W * st.split[1]);
  L.a = { x: 0, y: py, w: xa - gap, h: ph };
  L.b = { x: xa, y: py, w: xb - xa - gap, h: ph };
  L.c = { x: xb, y: py, w: W - xb, h: ph };
  if (specCols !== L.c.w) {
    // carry the current curve over when a drag resizes the spectrum so it doesn't blink
    const remap = (old) => { const a = new Float32Array(L.c.w); for (let i = 0; i < L.c.w; i++) a[i] = old ? old[Math.floor(i / L.c.w * old.length)] : -140; return a; };
    specS = remap(specS); specP = remap(specP);
    specCols = L.c.w;
  }
}

const fmt = s => { s = Math.max(0, s || 0); return `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`; };

// DAW-ish header: big M:S:CS clock, a live mini scope box, breadcrumb
// little gray square toolbar button with a glyph, FL-style
function iconBtn(x, y, s, glyph) {
  ctx.fillStyle = 'rgba(255,255,255,0.42)';
  ctx.beginPath(); ctx.roundRect(x, y, s, s, s * 0.12); ctx.fill();
  if (!glyph) return;
  ctx.fillStyle = '#000'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `${Math.round(s * 0.62)}px ${FONT}`;
  ctx.fillText(glyph, x + s / 2, y + s * 0.54);
}

function drawHeader(t) {
  const s = Math.max(0, t), cs = String(Math.floor((s % 1) * 100)).padStart(2, '0');
  const clock = `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}:${cs}`;
  const u = H * 0.001; // header unit
  const r1 = Math.round(H * 0.062), r2 = Math.round(H * 0.124), bs = Math.round(H * 0.046);
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';

  // row 1: icons, clock, peak monitor, meters, slider, readouts, icons
  iconBtn(bs * 0.35, r1 - bs / 2, bs, '↺');
  // mini master section between the refresh button and the clock
  const mmx = bs * 1.6, mmw = bs * 2.7;
  drawMiniMaster(mmx, r1 - bs / 2, mmw, bs, dtFrame);
  const x = Math.round(Math.max(W * 0.1, mmx + mmw + bs * 0.4)), fs = Math.round(H * 0.068);
  ctx.textAlign = 'left'; ctx.fillStyle = '#fff'; ctx.font = `${fs}px ${FONT}`;
  ctx.fillText(clock, x, r1);
  const cw = ctx.measureText(clock).width;
  ctx.font = `500 ${Math.round(fs * 0.17)}px ${FONT}`;
  ctx.fillText('M:S:CS', x + cw + 4 * u, r1 - fs * 0.3);

  let bx = x + cw + fs * 0.62;
  const bw = W * 0.105, bh = fs * 0.62, by = r1 - bh / 2;
  ctx.fillStyle = 'rgba(255,255,255,0.1)'; ctx.fillRect(bx, by, bw, bh);
  ctx.fillStyle = '#fff';
  const hist = st.hist, hw = bw / hist.length;
  // history ticks at 40 Hz but scrolls continuously between ticks, so it glides at any refresh rate
  const shift = st.histAcc * 40 * hw;
  ctx.save(); ctx.beginPath(); ctx.rect(bx, by, bw, bh); ctx.clip();
  for (let i = 0; i < hist.length; i++) { const v = clamp(hist[i] * st.gain, 0, 1) * bh; ctx.fillRect(bx + i * hw - shift, by + bh - v, Math.ceil(hw), v); }
  ctx.restore();
  bx += bw + 6 * u;

  // two level meters (rms / peak) + position slider underneath
  const mw = W * 0.09, mh = bh * 0.22;
  for (const [i, v] of [[0, st.rms * st.gain * 1.4], [1, st.pk * st.gain]]) {
    const my = by + i * (mh + 5 * u);
    ctx.fillStyle = 'rgba(255,255,255,0.2)'; ctx.fillRect(bx, my, mw, mh);
    ctx.fillStyle = '#fff'; ctx.fillRect(bx, my, mw * clamp(v, 0, 1), mh);
  }
  const sy = by + bh * 0.95, sx = bx + mw * 0.1, sw = W * 0.2;
  ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.fillRect(sx, sy, sw, 1.5 * DPR);
  const kx = sx + sw * (audio.duration ? s / audio.duration : 0);
  ctx.beginPath(); ctx.arc(kx, sy, 4 * u, 0, Math.PI * 2); ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5 * DPR; ctx.stroke();
  // waterfall in the gap right of the meters, above the slider
  const wx0 = bx + mw + bs * 0.35, wx1 = sx + sw;
  if (wx1 - wx0 > bs) drawWaterfall(wx0, by, wx1 - wx0, sy - by - bs * 0.18, dtFrame);

  // readouts: tempo + heap stacked over play state, like FL's "0 / 940 MB / 1"
  let ix = sx + sw + bs * 0.5;
  ctx.fillStyle = '#fff'; ctx.textAlign = 'left';
  ctx.font = `500 ${Math.round(bs * 0.36)}px ${FONT}`;
  const mb = performance.memory ? Math.round(performance.memory.usedJSHeapSize / 1048576) : 0;
  const top = `${st.bpm ? st.bpm.toFixed(3) : '---.---'} BPM${mb ? `  ${mb} MB` : ''}`;
  ctx.fillText(top, ix, r1 - bh * 0.25);
  ctx.font = `500 ${Math.round(bs * 0.48)}px ${FONT}`;
  ctx.fillText(`${audio.paused ? 0 : 1}`, ix + bs * 0.6, r1 + bh * 0.28);
  ctx.beginPath(); ctx.arc(ix + bs * 1.2, r1 + bh * 0.28, bs * 0.13, 0, Math.PI * 2); ctx.stroke();
  ctx.font = `500 ${Math.round(bs * 0.36)}px ${FONT}`;
  ix += ctx.measureText(top).width + bs * 0.6;
  for (const g of ['⏻', '✂', '♪', '?', '▣', '⇅', 'ⓘ', '⤓']) { if (ix > W) break; iconBtn(ix, r1 - bs / 2, bs, g); ix += bs * 1.22; }

  // row 2 flows left to right: icon, (none) ›, ›, Pattern 1, +, tool icons, the "update" note
  iconBtn(bs * 0.35, r2 - bs / 2, bs, '♜');
  ix = bs * 1.7;
  const txt = (str, size, weight = '500') => {
    ctx.fillStyle = '#fff'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.font = `${weight} ${Math.round(size)}px ${FONT}`;
    ctx.fillText(str, ix, r2); ix += ctx.measureText(str).width + bs * 0.35;
  };
  txt('⌒ (none) ›', bs * 0.4);
  iconBtn(ix, r2 - bs * 0.42, bs * 0.84, '›'); ix += bs * 1.2;
  txt('Pattern 1', bs * 0.58, '400');
  iconBtn(ix, r2 - bs * 0.42, bs * 0.84, '+'); ix += bs * 1.2;
  for (const g of ['⌸', '⌗', '☰', '⫶', '⌥', '▤', '♟', '⚲', '➤', '⛟']) { if (ix > W) break; iconBtn(ix, r2 - bs / 2, bs, g); ix += bs * 1.22; }
  ctx.fillStyle = '#fff'; ctx.textAlign = 'left'; ctx.font = `500 ${Math.round(bs * 0.3)}px ${FONT}`;
  ctx.fillText('Today', ix + 4 * u, r2 - bs * 0.24);
  const nx = ix + ctx.measureText('Today').width + bs * 0.4;
  ctx.fillText('Every hit.', nx, r2 - bs * 0.24);
  ctx.fillText('On the line.', nx, r2 + bs * 0.24);

  // sub driver: fills the free block after the note, from under the row-1 buttons down to just above the divider
  const sx0 = nx + ctx.measureText('On the line.').width + bs * 0.9, sx1 = W - bs * 0.5;
  const sy0 = r1 + bs * 0.75, sy1 = H * 0.196 - bs * 0.25, scy = (sy0 + sy1) / 2;
  if (sx1 - sx0 > bs * 2.5) {
    const half = (sx1 - sx0) / 2, scx = sx0 + half, ch = (sy1 - sy0) * 0.36;
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.fillRect(sx0, scy, half * 2, DPR);
    // scale in mm of cone travel: full rail = ±XMAX (a big sub's rated linear stroke)
    ctx.font = `500 ${Math.round(bs * 0.2)}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    for (const k of [-1, -0.75, -0.5, -0.25, 0, 0.25, 0.5, 0.75, 1]) {
      const tall = k === 0 ? 0.5 : Math.abs(k) % 0.5 === 0 ? 0.3 : 0.16;
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      ctx.fillRect(scx + k * half - DPR / 2, scy - ch * tall, DPR, ch * tall * 2);
      const mm = Math.round(k * XMAX);
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.fillText(`${mm > 0 ? '+' : ''}${mm}`, clamp(scx + k * half, sx0 + bs * 0.2, sx1 - bs * 0.2), scy + ch * 1.05);
    }
    // motion blur like an exposure: each slice of the frame smears the line across the distance it covered, with its
    // light spread over that width (fast = dim streak, slow / stroke ends = bright), summed additively
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    // brighter while it's actually moving: boost by total travel this frame (rail widths), so fast swings glow
    let travel = 0;
    for (let k = 1; k < CONE_TAPS; k++) travel += Math.abs(cone.pos[k] - cone.pos[k - 1]);
    const motion = clamp(travel / 1.2, 0, 1), boost = 1 + 8 * motion;
    const lw = Math.max(3 * DPR, half * 0.012), share = 1.15 * boost / (CONE_TAPS - 1);
    for (let k = 0; k < CONE_TAPS - 1; k++) {
      const a = scx + cone.pos[k] * half, b = scx + cone.pos[k + 1] * half;
      const x0 = Math.min(a, b) - lw / 2, w = Math.abs(b - a) + lw;
      ctx.fillStyle = `rgba(255,255,255,${Math.min(1, share * lw / w).toFixed(4)})`;
      ctx.fillRect(x0, scy - ch, w, ch * 2);
    }
    // where the cone is right now, lit up in proportion to how hard it's moving
    if (motion > 0.02) {
      ctx.fillStyle = `rgba(255,255,255,${(0.35 + 0.65 * motion).toFixed(3)})`;
      ctx.fillRect(scx + cone.pos[CONE_TAPS - 1] * half - lw / 2, scy - ch, lw, ch * 2);
    }
    ctx.restore();
    ctx.font = `500 ${Math.round(bs * 0.26)}px ${FONT}`; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.fillText('SUB', sx0, sy0);
    ctx.textAlign = 'right';
    ctx.fillText(`peak ±${(cone.peak * XMAX).toFixed(1)} mm   Xmax ±${XMAX} mm`, sx1, sy0);
    ctx.textBaseline = 'middle';
  }

  ctx.font = `500 ${Math.round(H * 0.022)}px ${FONT}`;
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff'; // SUB readout leaves these right-aligned
  const crumb = `≡ - Arrangement › ${trackName || 'untitled'} ›`;
  ctx.fillText(crumb, bs * 0.35, H * 0.168);
  // kick lane fills the strip under the toolbar, between the breadcrumb and the SUB block
  const kx0 = bs * 0.35 + ctx.measureText(crumb).width + bs * 0.6, kx1 = Math.min(sx0, W) - bs * 0.6;
  const ky0 = r2 + bs * 0.62, ky1 = H * 0.196 - bs * 0.12;
  if (kx1 - kx0 > bs * 3 && ky1 - ky0 > bs * 0.3) drawKickLane(kx0, ky0, kx1 - kx0, ky1 - ky0, s);
  ctx.font = `500 ${Math.round(H * 0.022)}px ${FONT}`; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.fillRect(0, H * 0.196, W, 2 * DPR);
}

// zoomed arrangement strip: clip header band + waveform scrolling under a centred playhead
function drawTimeline(t) {
  if (!audio.src) return;
  const { y, h } = L.ov, mid = y + h / 2, span = 7, pps = W / span, x0 = W / 2 - t * pps;
  const dur = audio.duration || 0;
  const c0 = Math.max(0, x0), c1 = dur ? Math.min(W, x0 + dur * pps) : W;
  const bandH = Math.max(9 * DPR, H * 0.024), bandY = y - bandH - 4 * DPR;
  ctx.fillStyle = 'rgba(255,255,255,0.92)';
  ctx.fillRect(c0, bandY, c1 - c0, bandH);
  ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.font = `500 ${Math.round(bandH * 0.75)}px ${FONT}`;
  ctx.fillText(trackName || '', c0 + 5 * DPR, bandY + bandH / 2);

  ctx.fillStyle = '#fff';
  if (peaks) {
    const path = new Path2D();
    for (let px = Math.floor(c0); px < c1; px += 1) {
      const i0 = Math.floor((px - x0) / pps * peaks.rate), i1 = Math.max(i0 + 1, Math.floor((px + 1 - x0) / pps * peaks.rate));
      let lo = 0, hi = 0;
      for (let i = i0; i < i1 && i < peaks.n; i++) { if (i < 0) continue; if (peaks.mn[i] < lo) lo = peaks.mn[i]; if (peaks.mx[i] > hi) hi = peaks.mx[i]; }
      path.rect(px, mid - hi * h * 0.5, 1, Math.max(1.5 * DPR, (hi - lo) * h * 0.5));
    }
    ctx.fill(path);
  } else ctx.fillRect(c0, mid, c1 - c0, 1.5 * DPR);

  if (dur) {
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.fillRect(W / 2, bandY - 6 * DPR, DPR, h + bandH + 10 * DPR);
  }
}

function drawTitle(t) {
  if (!document.body.classList.contains('loaded')) return; // the DOM empty state owns the middle
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const fs = Math.round(Math.min(H * 0.07, W * 0.05));
  ctx.font = `${fs}px ${PIXEL}`;
  L.titleW = Math.max(ctx.measureText(trackName || 'beatscope').width, ctx.measureText('(00:00 / 00:00)').width);
  ctx.fillText(trackName || 'beatscope', W / 2, L.title);
  ctx.fillText(`(${fmt(t)} / ${fmt(audio.duration)})`, W / 2, L.title + fs * 0.95);
}

// pane A: the whole 8192-sample window squashed into columns, min/max in gray, rms band in white
function drawDense() {
  const { x, y, w, h } = L.a, mid = y + h / 2, amp = h / 2, g = st.gain, per = FFT / w;
  const mm = new Path2D(), rb = new Path2D();
  for (let i = 0; i < w; i++) {
    const s = Math.floor(i * per), e = Math.floor((i + 1) * per);
    let mn = 1, mx = -1, sq = 0;
    for (let j = s; j < e; j++) { const v = td[j]; if (v < mn) mn = v; if (v > mx) mx = v; sq += v * v; }
    const top = clamp(mx * g), bot = clamp(mn * g), r = clamp(Math.sqrt(sq / (e - s)) * g * 1.5, 0, 1);
    mm.rect(x + i, mid - top * amp, 1, Math.max(DPR, (top - bot) * amp));
    rb.rect(x + i, mid - r * amp, 1, Math.max(DPR, r * 2 * amp));
  }
  ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.fill(mm);
  ctx.fillStyle = '#fff'; ctx.fill(rb);
}

// pane B: triggered oscilloscope with a soft fill to the centre line
function drawScope() {
  const { x, y, w, h } = L.b, mid = y + h / 2, amp = h * 0.46, g = st.gain;
  // one-pole lowpass for a jitter-free rising zero-crossing trigger
  const lo = FFT - SCOPE_N - 2400;
  let p = td[lo];
  for (let i = lo; i < FFT; i++) { p += (td[i] - p) * 0.08; lp[i] = p; }
  let start = FFT - SCOPE_N;
  for (let i = FFT - SCOPE_N; i > lo + 1; i--) if (lp[i - 1] < 0 && lp[i] >= 0) { start = i; break; }

  const path = new Path2D();
  for (let px = 0; px <= w; px++) {
    const f = start + px / w * (SCOPE_N - 1), i = Math.floor(f), fr = f - i;
    const v = td[i] + (td[Math.min(i + 1, FFT - 1)] - td[i]) * fr;
    const yy = mid - clamp(v * g, -1.05, 1.05) * amp;
    px ? path.lineTo(x + px, yy) : path.moveTo(x, yy);
  }
  const fill = new Path2D(path);
  fill.lineTo(x + w, mid); fill.lineTo(x, mid); fill.closePath();
  // fill fades toward the centre line (bright out at the trace, dim gray at centre), mirrored both halves
  const grad = ctx.createLinearGradient(0, mid - amp, 0, mid + amp);
  grad.addColorStop(0, 'rgba(255,255,255,0.62)');
  grad.addColorStop(0.5, 'rgba(255,255,255,0.2)');
  grad.addColorStop(1, 'rgba(255,255,255,0.62)');
  ctx.fillStyle = grad; ctx.fill(fill);
  ctx.lineWidth = 2.2 * DPR; ctx.lineJoin = 'round'; ctx.strokeStyle = '#fff'; ctx.stroke(path);
}

const GRID = [];
for (const dec of [10, 100, 1000, 10000]) for (let k = 1; k <= 9; k++) { const f = k * dec; if (f >= 20 && f <= 20000) GRID.push(f); }
GRID.push(20000);
const NOTES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
const noteOf = f => { const m = Math.round(12 * Math.log2(f / 440) + 69); return NOTES[(m % 12 + 12) % 12] + (Math.floor(m / 12) - 1); };

// pane C: log spectrum, smoothed curve + decaying peak-hold, decade grid, readout
function drawSpectrum(dt) {
  const { x, y, w, h } = L.c, sr = ac ? ac.sampleRate : 48000, hz = sr / FFT;
  const fx = f => x + Math.log(f / 20) / Math.log(1000) * w;
  const lift = 20 * Math.log10(st.gain) * 0.5, dbMin = -96, dbMax = -8;
  const fy = db => y + h * (1 - clamp((db + lift - dbMin) / (dbMax - dbMin), 0, 1.02));
  const att = ease(dt, 0.012), rel = ease(dt, 0.1);

  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  for (const f of GRID) ctx.fillRect(Math.round(fx(f)), y, DPR, h);

  let best = -1e9, bestCol = 0;
  for (let c = 0; c < specCols; c++) {
    const f0 = 20 * Math.pow(1000, c / specCols), f1 = 20 * Math.pow(1000, (c + 1) / specCols);
    const b0 = f0 / hz, b1 = f1 / hz;
    let db;
    if (b1 - b0 < 1) { const i = Math.floor(b0), fr = b0 - i; db = fd[i] + (fd[i + 1] - fd[i]) * fr; }
    else { db = -200; for (let b = Math.floor(b0); b < Math.ceil(b1); b++) if (fd[b] > db) db = fd[b]; }
    if (!isFinite(db)) db = -140;
    const s = specS[c];
    specS[c] = s + (db - s) * (db > s ? att : rel);
    specP[c] = Math.max(specS[c], specP[c] - 22 * dt);
    if (specS[c] > best) { best = specS[c]; bestCol = c; }
  }

  const curve = (arr, lw, style) => {
    ctx.beginPath();
    for (let c = 0; c < specCols; c++) { const yy = fy(arr[c]); c ? ctx.lineTo(x + c, yy) : ctx.moveTo(x, yy); }
    ctx.lineWidth = lw; ctx.strokeStyle = style; ctx.stroke();
  };
  curve(specP, 1.2 * DPR, 'rgba(255,255,255,0.75)');
  curve(specS, 2 * DPR, '#fff');

  const fs = Math.round(Math.max(10 * DPR, h * 0.045));
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.font = `${Math.round(fs * 0.75)}px ${FONT}`;
  ctx.fillStyle = 'rgba(255,255,255,0.8)';
  ctx.fillText('100Hz', fx(100) + 3 * DPR, y + 2 * DPR);
  ctx.fillText('1kHz', fx(1000) + 3 * DPR, y + 2 * DPR);
  ctx.fillText('10kHz', fx(10000) + 3 * DPR, y + 2 * DPR);

  // readout bubble rides just under the peak and glides after it
  const bf = 20 * Math.pow(1000, (bestCol + 0.5) / specCols);
  const label = `${(best + lift).toFixed(2)}dB | ${bf.toFixed(2)}Hz | ${noteOf(bf)}`;
  ctx.font = `500 ${fs}px ${FONT}`;
  const tw = ctx.measureText(label).width;
  const tx = x + bestCol + 4 * DPR, ty = fy(best) + 6 * DPR, k = ease(dt, 0.045);
  bub.x = bub.x == null ? tx : bub.x + (tx - bub.x) * k;
  bub.y = bub.y == null ? ty : bub.y + (ty - bub.y) * k;
  const lx = Math.min(bub.x, x + w - tw - 6 * DPR), ly = clamp(bub.y, y + fs * 1.2, y + h - fs * 2);
  ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(lx - 5 * DPR, ly - 3 * DPR, tw + 10 * DPR, fs + 6 * DPR);
  ctx.fillStyle = '#fff'; ctx.fillText(label, lx, ly);
}
const bub = { x: null, y: null };

// radius for the two side scopes: fits the strip-to-panes gap, and the room beside the title
// (scope ≈ 3.3R wide plus its stacked label, which is ~13 chars of the small mono font)
function sideR() {
  const byGap = (L.a.y - L.ov.y - L.ov.h) / 2 / 1.75;
  const side = (W - (L.titleW || 0)) / 2 - W * 0.035 - H * 0.014 * 0.62 * 13 - W * 0.015;
  return Math.max(H * 0.02, Math.min(byGap, W * 0.09, side / 3.5));
}

// polar bass scope: two periods of the lowpassed signal wrapped around a circle, so it holds shape instead of spinning
const ring = { period: 800, hz: 0, pk: 0.05 };
function drawBassRing(dt) {
  if (!anBass) for (let i = 0; i < BASS_N; i++) tdBass[i] = Math.sin(i * 0.008) * 0.01;
  const sr = ac ? ac.sampleRate : 48000, D = 8, n = BASS_N / D;

  // fundamental by autocorrelation on a decimated copy, 30–200 Hz
  let pk = 0;
  for (let i = 0; i < BASS_N; i++) pk = Math.max(pk, Math.abs(tdBass[i]));
  ring.pk = pk > ring.pk ? pk : ring.pk + (pk - ring.pk) * ease(dt, 1.5);
  const lagLo = Math.floor(sr / D / 200), lagHi = Math.min(Math.floor(sr / D / 30), n - 64);
  let best = 0, bestLag = 0;
  for (let lag = lagLo; lag <= lagHi; lag++) {
    let c = 0, e1 = 0, e2 = 0;
    for (let i = n - 1; i >= n - 256 && i - lag >= 0; i--) {
      const a = tdBass[i * D], b = tdBass[(i - lag) * D];
      c += a * b; e1 += a * a; e2 += b * b;
    }
    const r = c / Math.sqrt(e1 * e2 + 1e-12);
    if (r > best) { best = r; bestLag = lag; }
  }
  if (best > 0.6 && pk > 0.002) { const p = bestLag * D; ring.period += (p - ring.period) * ease(dt, 0.05); ring.hz = sr / ring.period; }

  const span = Math.min(BASS_N - 2, Math.round(ring.period * 2));
  let start = BASS_N - span - 1;
  for (let i = start; i > Math.max(1, start - ring.period * 1.5); i--) if (tdBass[i - 1] < 0 && tdBass[i] >= 0) { start = i; break; }

  // anchored left, centred in the gap between the strip and the panes; sized so the peaks (≈1.65R) never reach either
  const R = sideR(), cx = W * 0.035 + R * 1.65, cy = (L.ov.y + L.ov.h + L.a.y) / 2;
  const g = clamp(0.9 / Math.max(ring.pk, 0.01), 1, 30);
  const k = ease(dt, 0.02), path = new Path2D();
  for (let i = 0; i <= RING_M; i++) {
    const m = i % RING_M;
    if (i < RING_M) {
      const f = start + m / RING_M * span, j = Math.floor(f), fr = f - j;
      const v = tdBass[j] + (tdBass[j + 1] - tdBass[j]) * fr;
      const target = 1 + 0.55 * clamp(v * g) + 0.08 * st.pulse;
      ringR[m] += (target - ringR[m]) * k;
    }
    const th = m / RING_M * Math.PI * 2 - Math.PI / 2, r = R * ringR[m];
    const px = cx + Math.cos(th) * r, py = cy + Math.sin(th) * r;
    i ? path.lineTo(px, py) : path.moveTo(px, py);
  }
  ctx.strokeStyle = 'rgba(255,255,255,0.22)'; ctx.lineWidth = DPR;
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.fill(path);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2 * DPR; ctx.lineJoin = 'round'; ctx.stroke(path);

  // label beside the ring, stacked, so nothing hangs down into the panes
  ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  const lfs = Math.round(H * 0.014), lx = cx + R * 1.75;
  ctx.font = `500 ${lfs}px ${FONT}`;
  ctx.fillText('BASS', lx, cy - lfs * 0.7);
  if (ring.hz && audio.src) ctx.fillText(`${ring.hz.toFixed(1)}Hz | ${noteOf(ring.hz)}`, lx, cy + lfs * 0.7);
}

// stereo phase scope (goniometer): mid up, side across, with fading trails and a correlation meter.
// mirrors the bass ring on the right edge.
const gonio = { trails: [], pk: 0.1, corr: 1 };

// Scrolling spectrogram: log frequency up the side (30 Hz bottom, 16 kHz top), time scrolling left, level = brightness.
// Scrolls by time (≈4 s across) so the speed is the same at any refresh rate.
const wf = { c: document.createElement('canvas'), acc: 0 };
wf.x = wf.c.getContext('2d');
function drawWaterfall(x, y, w, h, dt) {
  w = Math.round(w); h = Math.round(h);
  if (w < 4 || h < 4) return;
  if (wf.c.width !== w || wf.c.height !== h) { wf.c.width = w; wf.c.height = h; wf.x.fillStyle = '#000'; wf.x.fillRect(0, 0, w, h); }
  if (!audio.paused && specS) {
    wf.acc += dt * w / 4;
    const n = Math.min(w, Math.floor(wf.acc));
    if (n > 0) {
      wf.acc -= n;
      wf.x.drawImage(wf.c, -n, 0);
      const img = wf.x.createImageData(n, h), d = img.data, lift = 20 * Math.log10(st.gain) * 0.5;
      for (let r = 0; r < h; r++) {
        const f = 30 * Math.pow(533, 1 - r / (h - 1));
        const c = clamp(Math.round(specCols * Math.log(f / 20) / Math.log(1000)), 0, specCols - 1);
        const v = Math.round(255 * Math.pow(clamp((specS[c] + lift + 92) / 72, 0, 1), 1.6));
        for (let j = 0; j < n; j++) { const o = (r * n + j) * 4; d[o] = d[o + 1] = d[o + 2] = v; d[o + 3] = 255; }
      }
      wf.x.putImageData(img, w - n, 0);
    }
  }
  ctx.drawImage(wf.c, x, y);
  ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = DPR; ctx.strokeRect(x, y, w, h);
}

// Kick lane: the offline kicks on a timeline scrolling past a playhead (30% in, so more of what's coming shows).
// Height = strength, invert hits are solid bars, faint lines are the beat grid at the detected tempo.
function drawKickLane(x, y, w, h, t) {
  const span = 6, ph = x + w * 0.3, pps = w / span, t0 = t - (ph - x) / pps, t1 = t0 + span;
  ctx.fillStyle = 'rgba(255,255,255,0.06)'; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = 'rgba(255,255,255,0.3)'; ctx.fillRect(x, y + h - DPR, w, DPR);
  if (st.bpm) {
    const beat = 60 / st.bpm, b0 = beats && beats.length ? beats[0].t : 0;
    for (let k = Math.ceil((t0 - b0) / beat); b0 + k * beat < t1; k++) {
      const gx = x + (b0 + k * beat - t0) * pps;
      ctx.fillStyle = k % 4 === 0 ? 'rgba(255,255,255,0.22)' : 'rgba(255,255,255,0.09)';
      ctx.fillRect(gx, y, DPR, h);
    }
  }
  if (beats) {
    for (const b of beats) {
      if (b.t < t0 - 0.1) continue;
      if (b.t > t1) break;
      const bx = x + (b.t - t0) * pps, bh = h * (0.18 + 0.82 * b.s), age = t - b.t;
      const hot = age >= 0 && age < 0.12 ? 1 - age / 0.12 : 0;      // flash as it crosses the playhead
      const past = age > 0 ? 0.45 : 1;
      ctx.fillStyle = `rgba(255,255,255,${Math.min(1, past * (b.inv ? 0.95 : 0.6) + hot).toFixed(3)})`;
      const bw = (b.inv ? 5 : 2) * DPR + hot * 4 * DPR;
      ctx.fillRect(bx - bw / 2, y + h - bh, bw, bh);
    }
  }
  ctx.fillStyle = '#fff'; ctx.fillRect(ph - DPR, y - DPR * 2, 2 * DPR, h + DPR * 2);
  ctx.font = `500 ${Math.round(h * 0.28)}px ${FONT}`; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.fillText('KICKS', x + 3 * DPR, y + 2 * DPR);
}

// FL-style mini master: L/R level bars with peak-hold ticks, then a 24-band spectrum. Levels are in dBFS
// (-48..0) so it reads like a real master meter, not auto-gained.
const master = { l: 0, r: 0, holdL: 0, holdR: 0, bands: new Float32Array(24) };
function drawMiniMaster(x, y, w, h, dt) {
  let pl = 0, pr = 0;
  for (let i = 0; i < GONIO_N; i++) { pl = Math.max(pl, Math.abs(tdL[i])); pr = Math.max(pr, Math.abs(tdR[i])); }
  const db = v => clamp((20 * Math.log10(v + 1e-6) + 48) / 48, 0, 1);
  const tl = audio.paused ? 0 : db(pl), tr = audio.paused ? 0 : db(pr);
  master.l = tl > master.l ? tl : master.l + (tl - master.l) * ease(dt, 0.12);
  master.r = tr > master.r ? tr : master.r + (tr - master.r) * ease(dt, 0.12);
  master.holdL = Math.max(master.l, master.holdL - dt * 0.35);
  master.holdR = Math.max(master.r, master.holdR - dt * 0.35);

  ctx.fillStyle = 'rgba(255,255,255,0.1)'; ctx.fillRect(x, y, w, h);
  const mw = w * 0.09, gap = w * 0.03, pad = h * 0.1, ih = h - pad * 2;
  for (const [i, v, hold] of [[0, master.l, master.holdL], [1, master.r, master.holdR]]) {
    const mx = x + pad + i * (mw + gap);
    ctx.fillStyle = 'rgba(255,255,255,0.18)'; ctx.fillRect(mx, y + pad, mw, ih);
    ctx.fillStyle = '#fff'; ctx.fillRect(mx, y + pad + ih * (1 - v), mw, ih * v);
    ctx.fillRect(mx, y + pad + ih * (1 - hold) - DPR, mw, 2 * DPR);
  }
  // spectrum bands from the main analyser's smoothed curve, log-spaced 30 Hz–16 kHz
  const bx = x + pad + 2 * mw + gap * 2.5, bw = x + w - pad - bx, n = master.bands.length, cw = bw / n;
  for (let i = 0; i < n; i++) {
    let m = -140;
    if (specS) {
      const c0 = Math.floor(specCols * Math.log(30 * Math.pow(533, i / n) / 20) / Math.log(1000));
      const c1 = Math.floor(specCols * Math.log(30 * Math.pow(533, (i + 1) / n) / 20) / Math.log(1000));
      for (let c = clamp(c0, 0, specCols - 1); c <= clamp(c1, 0, specCols - 1); c++) m = Math.max(m, specS[c]);
    }
    const t = audio.paused ? 0 : clamp((m + 90) / 80, 0, 1);
    master.bands[i] = t > master.bands[i] ? t : master.bands[i] + (t - master.bands[i]) * ease(dt, 0.08);
    const bh = ih * master.bands[i];
    ctx.fillStyle = '#fff'; ctx.fillRect(bx + i * cw, y + pad + ih - bh, Math.max(DPR, cw * 0.7), bh);
  }
}
function drawGonio(dt) {
  if (anL) { anL.getFloatTimeDomainData(tdL); anR.getFloatTimeDomainData(tdR); }
  let eL = 0, eR = 0, lr = 0;
  for (let i = 0; i < GONIO_N; i++) { eL += tdL[i] * tdL[i]; eR += tdR[i] * tdR[i]; lr += tdL[i] * tdR[i]; }
  const mono = eR < eL * 1e-4; // mono files: the splitter leaves channel 1 silent
  if (mono) { tdR.set(tdL); eR = eL; lr = eL; }
  const c = eL > 1e-9 && eR > 1e-9 ? lr / Math.sqrt(eL * eR) : 1;
  gonio.corr += (c - gonio.corr) * ease(dt, 0.15);

  const R = sideR(), cx = W - (W * 0.035 + R * 1.65), cy = (L.ov.y + L.ov.h + L.a.y) / 2, S = R * 1.45;

  let pk = 0;
  const pts = new Float32Array(GONIO_N * 2);
  for (let i = 0; i < GONIO_N; i++) {
    const m = (tdL[i] + tdR[i]) * Math.SQRT1_2, s = (tdL[i] - tdR[i]) * Math.SQRT1_2;
    pk = Math.max(pk, Math.abs(m), Math.abs(s));
    pts[i * 2] = s; pts[i * 2 + 1] = m;
  }
  gonio.pk = pk > gonio.pk ? gonio.pk + (pk - gonio.pk) * ease(dt, 0.03) : gonio.pk + (pk - gonio.pk) * ease(dt, 1.2);
  const g = clamp(0.92 / Math.max(gonio.pk, 0.01), 1, 30);
  gonio.trails.unshift(pts);
  gonio.trails.length = Math.min(gonio.trails.length, trailLen(dt, 0.07));

  // diamond frame: the L and R axes sit at ±45°, M vertical, S horizontal
  ctx.strokeStyle = 'rgba(255,255,255,0.22)'; ctx.lineWidth = DPR;
  ctx.beginPath(); ctx.moveTo(cx, cy - S); ctx.lineTo(cx + S, cy); ctx.lineTo(cx, cy + S); ctx.lineTo(cx - S, cy); ctx.closePath(); ctx.stroke();
  ctx.beginPath();

  ctx.moveTo(cx + S / 2, cy - S / 2); ctx.lineTo(cx - S / 2, cy + S / 2);
  ctx.moveTo(cx, cy - S); ctx.lineTo(cx, cy + S);
  ctx.strokeStyle = 'rgba(255,255,255,0.1)'; ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.font = `500 ${Math.round(H * 0.012)}px ${FONT}`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('M', cx, cy - S - H * 0.012);
  ctx.fillText('L', cx - S / 2 - H * 0.012, cy - S / 2 - H * 0.008);
  ctx.fillText('R', cx + S / 2 + H * 0.012, cy - S / 2 - H * 0.008);

  // newest trail brightest; points clipped to the frame
  for (let k = gonio.trails.length - 1; k >= 0; k--) {
    const p = gonio.trails[k], path = new Path2D();
    for (let i = 0; i < GONIO_N; i++) {
      let x = p[i * 2] * g, y = p[i * 2 + 1] * g;
      const d = Math.abs(x) + Math.abs(y); if (d > 1) { x /= d; y /= d; }

    ctx.lineWidth = (k ? 1 : 1.4) * DPR; ctx.stroke(path);
  }

  const lfs = Math.round(H * 0.014), rx = cx - R * 1.75;
  ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.textAlign = 'right'; ctx.font = `500 ${lfs}px ${FONT}`;
  ctx.fillText(mono ? 'PHASE  mono' : 'PHASE', rx, cy - lfs * 1.4);
  ctx.fillText(`corr ${gonio.corr >= 0 ? '+' : ''}${gonio.corr.toFixed(2)}`, rx, cy);
  const mw = R * 1.2, my = cy + lfs * 1.3, mh = Math.max(2 * DPR, lfs * 0.35);
  ctx.fillStyle = 'rgba(255,255,255,0.2)'; ctx.fillRect(rx - mw, my, mw, mh);
  ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.fillRect(rx - mw / 2 - DPR / 2, my - mh * 0.6, DPR, mh * 2.2);
  const cv01 = (clamp(gonio.corr) + 1) / 2;
  ctx.fillStyle = '#fff'; ctx.fillRect(rx - mw + cv01 * mw - 2 * DPR, my - mh * 0.4, 4 * DPR, mh * 1.8);
}

let dtFrame = 1 / 60;
function draw(t, dt) {
  dtFrame = dt;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  drawHeader(t);
  drawTimeline(t);
  drawTitle(t);
  if (audio.src) { drawBassRing(dt); drawGonio(dt); }
  drawDense(); drawScope(); drawSpectrum(dt);
  if (st.hoverDiv >= 0) {
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.fillRect(Math.round(st.split[st.hoverDiv] * W) - L.gap / 2 - DPR, L.a.y, 2 * DPR, H - L.a.y);
  }
}

// ---------- webgl post: bloom, grain, slight lens, hard invert ----------
const gl = glc.getContext('webgl2', { antialias: false, alpha: false, powerPreference: 'high-performance' });
const VS = `#version 300 es
out vec2 uv; void main(){ vec2 p=vec2((gl_VertexID<<1)&2, gl_VertexID&2); uv=p; gl_Position=vec4(p*2.-1.,0,1); }`;
const HDR = `#version 300 es
precision highp float; in vec2 uv; out vec4 o;`;
const FS_DOWN = HDR + `uniform sampler2D t; uniform vec2 px;
void main(){ o = 0.25*(texture(t,uv+px*vec2(-1,-1))+texture(t,uv+px*vec2(1,-1))+texture(t,uv+px*vec2(-1,1))+texture(t,uv+px*vec2(1,1))); }`;
const FS_BLUR = HDR + `uniform sampler2D t; uniform vec2 d;
void main(){ vec3 c=texture(t,uv).rgb*0.2270270;
  c+=(texture(t,uv+d*1.3846154).rgb+texture(t,uv-d*1.3846154).rgb)*0.3162162;
  c+=(texture(t,uv+d*3.2307692).rgb+texture(t,uv-d*3.2307692).rgb)*0.0702703; o=vec4(c,1); }`;
const FS_FINAL = HDR + `uniform sampler2D base,b1,b2; uniform float time,inv,pulse,glow,warp,zoom; uniform vec2 res;
float hash(vec2 p){ p=fract(p*vec2(443.897,441.423)); p+=dot(p,p.yx+19.19); return fract((p.x+p.y)*p.x); }
void main(){
  // wide phone lens: aspect-correct pincushion, edges stretched outward (keep in sync with toContent())
  float a=res.x/res.y;
  vec2 c=(uv-0.5)*vec2(a,1.0); float r2=dot(c,c);
  vec2 q=c*zoom*(1.0-warp*r2); q.x/=a; q+=0.5;
  float edge=smoothstep(0.25,1.0,r2);
  float l=0.0;
  if(q.x>=0.0&&q.y>=0.0&&q.x<=1.0&&q.y<=1.0){
    vec3 s=texture(base,q).rgb, g1=texture(b1,q).rgb, g2=texture(b2,q).rgb;
    s=mix(s,g1*1.5,edge*0.3);                        // slight lens softness at the far edges
    vec3 col=s*0.93 + glow*(g1*(0.5+0.5*pulse) + g2*(0.5+0.7*pulse));
    l=dot(col,vec3(0.299,0.587,0.114));
    l=1.0-exp(-l*2.3);
  }
  l=mix(l,1.0-l*0.92,inv);
  l=0.015+l*0.97;
  float fine=hash(uv*res+fract(time*7.31)*917.0)-0.5;
  float chunk=hash(floor(uv*res/2.0)+fract(time*3.17)*311.0)-0.5;
  l+=(fine*0.08+chunk*0.1)*(0.55+0.6*l);
  l*=1.0-r2*0.18*(1.0-0.6*inv);
  o=vec4(vec3(l),1);
}`;

function prog(fs) {
  const p = gl.createProgram();
  for (const [type, src] of [[gl.VERTEX_SHADER, VS], [gl.FRAGMENT_SHADER, fs]]) {
    const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    gl.attachShader(p, s);

  return { p, u };
}
const P = gl && { down: prog(FS_DOWN), blur: prog(FS_BLUR), final: prog(FS_FINAL) };

function makeTex(w, h) {
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  for (const [k, v] of [[gl.TEXTURE_MIN_FILTER, gl.LINEAR], [gl.TEXTURE_MAG_FILTER, gl.LINEAR], [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]]) gl.texParameteri(gl.TEXTURE_2D, k, v);

}

  if (src) gl.deleteTexture(src);
  src = makeTex(W, H);
  const w4 = Math.max(1, W >> 2), h4 = Math.max(1, H >> 2), w8 = Math.max(1, W >> 3), h8 = Math.max(1, H >> 3);
  R = { a4: target(w4, h4), b4: target(w4, h4), a8: target(w8, h8), b8: target(w8, h8) };
}

  for (const [k, v] of Object.entries(uniforms)) v.length === 2 ? gl.uniform2f(pr.u[k], v[0], v[1]) : gl.uniform1f(pr.u[k], v);

  for (let i = 0; i < 2; i++) {
    pass(P.blur, b8, a8.tex, { d: [(1 + i) / a8.w, 0] });

  gl.uniform1i(f.u.base, 0); gl.uniform1i(f.u.b1, 1); gl.uniform1i(f.u.b2, 2);

  gl.uniform1f(f.u.glow, st.glow ? 1 : 0); gl.uniform2f(f.u.res, W, H);
  gl.uniform1f(f.u.warp, lens.warp + 0.1 * st.pulse);

// screen pointer -> 2D-canvas pixel, through the same lens the shader applies (resting warp)
// zoom is solved in resize() so the frame's edge midpoints land exactly on screen at rest: nothing gets cropped,
// and the overshoot past the corners is black-on-black (the invert flips it with everything else)
const lens = { warp: 0.1, zoom: 1.0 };
function toContent(clientX, clientY) {
  if (!gl) return { x: clientX * DPR, y: clientY * DPR };
  const a = W / H, cx = (clientX / innerWidth - 0.5) * a, cy = (1 - clientY / innerHeight) - 0.5;
  const k = lens.zoom * (1 - lens.warp * (cx * cx + cy * cy));
  return { x: (cx * k / a + 0.5) * W, y: (1 - (cy * k + 0.5)) * H };

// ---------- loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  const t = now / 1000;
  analyse(t, dt);
  draw(playTime(), dt);
  const inv = t < st.invUntil ? 1 : 0;
  if (gl) post(t, inv);
  requestAnimationFrame(frame);
}

// without webgl, show the 2D canvas directly
if (!gl) { glc.replaceWith(cv); cv.id = 'gl'; }

// ---------- input ----------
const fileIn = $('#file');
$('#pick').onclick = () => fileIn.click();
fileIn.onchange = () => { load(fileIn.files[0]); fileIn.value = ''; };

let dragDepth = 0;
addEventListener('dragenter', e => { e.preventDefault(); dragDepth++; document.body.classList.add('drag'); });
addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove('drag'); } });
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => {
  e.preventDefault(); dragDepth = 0; document.body.classList.remove('drag');
  const f = [...e.dataTransfer.files].find(f => /^(audio|video)\//.test(f.type)) || e.dataTransfer.files[0];
  load(f);
});

function togglePlay() { if (!audio.src) return fileIn.click(); ac && ac.resume(); audio.paused ? audio.play() : audio.pause(); }
// the strip scrolls under a fixed playhead: click jumps to that spot, drag drags the tape
// the pane dividers drag with col-resize
let scrub = null, divDrag = -1;
const PPS = () => W / 7;
function divAt(p) {
  if (p.y < L.a.y - 10 * DPR) return -1;
  for (let i = 0; i < 2; i++) if (Math.abs(p.x - st.split[i] * W) < 10 * DPR) return i;
  return -1;
}
glc.addEventListener('pointerdown', e => {
  const p = toContent(e.clientX, e.clientY);
  const d = divAt(p);
  if (d >= 0) { divDrag = d; st.hoverDiv = d; glc.setPointerCapture(e.pointerId); return; }
  const { y, h } = L.ov;
  if (!audio.src || !audio.duration || p.y < y - 40 * DPR || p.y > y + h + 20 * DPR) return;
  glc.setPointerCapture(e.pointerId);
  scrub = { x: p.x, t: audio.currentTime, moved: false };
});
glc.addEventListener('pointermove', e => {
  const p = toContent(e.clientX, e.clientY);
  if (divDrag >= 0) {
    const min = 0.08, f = p.x / W;
    st.split[divDrag] = divDrag === 0 ? clamp(f, min, st.split[1] - min) : clamp(f, st.split[0] + min, 1 - min);
    layoutPanes();
    return;
  }
  if (scrub) {
    const dx = p.x - scrub.x;
    if (Math.abs(dx) > 4 * DPR) scrub.moved = true;
    if (scrub.moved) audio.currentTime = clamp(scrub.t - dx / PPS(), 0, audio.duration);
    return;
  }
  st.hoverDiv = divAt(p);
  glc.style.cursor = st.hoverDiv >= 0 ? 'col-resize' : '';
});
glc.addEventListener('pointerup', e => {
  if (divDrag >= 0) { divDrag = -1; try { localStorage.setItem('beatscope.split', JSON.stringify(st.split)); } catch (err) {} }
  if (scrub && !scrub.moved) audio.currentTime = clamp(scrub.t + (toContent(e.clientX, e.clientY).x - W / 2) / PPS(), 0, audio.duration);
  scrub = null;
});
glc.addEventListener('dblclick', e => {
  if (divAt(toContent(e.clientX, e.clientY)) < 0) return;
  st.split = [0.22, 0.65]; layoutPanes();
  try { localStorage.removeItem('beatscope.split'); } catch (err) {}
});

addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey) return;
  const k = e.key.toLowerCase();
  if (k === ' ') { e.preventDefault(); togglePlay(); }
  else if (k === 'arrowright') audio.currentTime = Math.min((audio.duration || 0), audio.currentTime + 5);
  else if (k === 'arrowleft') audio.currentTime = Math.max(0, audio.currentTime - 5);
  else if (k === 'i') { st.flashes = !st.flashes; st.invUntil = 0; $('#invState').textContent = st.flashes ? 'on' : 'off'; }
  else if (k === 'g') st.glow = !st.glow;
  else if (k === 'f') document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  else if (k === 'o') fileIn.click();
});

let idleTimer;
function wake() { document.body.classList.remove('idle'); clearTimeout(idleTimer); idleTimer = setTimeout(() => document.body.classList.add('idle'), 2500); }
addEventListener('pointermove', wake); addEventListener('keydown', wake); wake();

addEventListener('resize', resize);
resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
